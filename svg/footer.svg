<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 90" width="100%" height="90" fill="none">
  <defs>
    <linearGradient id="footerWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.25" />
    </linearGradient>
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      .star { animation: twinkle 3s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Stars -->
  <circle cx="120" cy="25" r="1.5" fill="#38bdf8" class="star" />
  <circle cx="280" cy="15" r="1.2" fill="#c084fc" class="star" style="animation-delay: 1s;" />
  <circle cx="580" cy="20" r="1.8" fill="#f472b6" class="star" style="animation-delay: 2s;" />
  <circle cx="750" cy="28" r="1.2" fill="#ffffff" class="star" style="animation-delay: 1.5s;" />

  <!-- Wave Lines -->
  <path d="M0,45 C200,20 380,60 550,35 C700,10 800,45 854,35 L854,90 L0,90 Z" fill="url(#footerWave)" />
  <path d="M0,55 C180,35 340,70 510,48 C680,25 780,55 854,48 L854,90 L0,90 Z" fill="#1e1035" opacity="0.6" />
</svg>
