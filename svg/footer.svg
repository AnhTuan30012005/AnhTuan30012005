<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 110" width="100%" height="110" fill="none">
  <defs>
    <linearGradient id="footerWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.20" />
    </linearGradient>
    <linearGradient id="textFooterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      .star { transform-origin: center; animation: twinkle 3s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Stars -->
  <circle cx="90" cy="22" r="1.5" fill="#38bdf8" class="star" />
  <circle cx="210" cy="15" r="1.2" fill="#c084fc" class="star" style="animation-delay: 0.8s;" />
  <circle cx="340" cy="28" r="1.8" fill="#fde047" class="star" style="animation-delay: 1.6s;" />
  <circle cx="530" cy="18" r="1.4" fill="#38bdf8" class="star" style="animation-delay: 2.2s;" />
  <circle cx="680" cy="25" r="1.7" fill="#f472b6" class="star" style="animation-delay: 1.2s;" />
  <circle cx="790" cy="16" r="1.3" fill="#ffffff" class="star" style="animation-delay: 0.5s;" />

  <!-- Wave Lines -->
  <path d="M0,52 C200,28 380,68 550,42 C700,18 800,52 854,42 L854,110 L0,110 Z" fill="url(#footerWave)" />
  <path d="M0,64 C180,44 340,78 510,58 C680,35 780,65 854,58 L854,110 L0,110 Z" fill="#0d1117" opacity="0.8" />

  <!-- Footer Text -->
  <text x="427" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="1.8" fill="url(#textFooterGrad)">
