<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Cosmic Gradient -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="30%" stop-color="#120c29" />
      <stop offset="60%" stop-color="#240c3d" />
      <stop offset="85%" stop-color="#180b30" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Nebulae Radial Gradients -->
    <radialGradient id="nebulaCyan" cx="20%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="55%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.30" />
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaPink" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#db2777" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaGold" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0" />
    </radialGradient>

    <!-- Title Glow Gradient -->
    <linearGradient id="textNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Planet Saturn Shading -->
    <radialGradient id="saturnBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="85%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>

    <!-- Saturn Ring Gradient -->
    <linearGradient id="saturnRings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fed7aa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.7" />
    </linearGradient>

    <!-- Moon Glow Gradient -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#fef9c3" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>

    <!-- Wave Stardust Gradient -->
    <linearGradient id="stardustWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.20" />
    </linearGradient>

    <!-- Shooting Star Gradients -->
    <linearGradient id="meteorTail1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="meteorTail2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#f472b6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes meteorShoot1 {
        0% { transform: translate(0px, 0px); opacity: 0; }
        15% { opacity: 1; }
        35% { transform: translate(-220px, 140px); opacity: 0; }
        100% { transform: translate(-220px, 140px); opacity: 0; }
      }
      @keyframes meteorShoot2 {
        0%, 45% { transform: translate(0px, 0px); opacity: 0; }
        55% { opacity: 1; }
        75% { transform: translate(-180px, 120px); opacity: 0; }
        100% { transform: translate(-180px, 120px); opacity: 0; }
      }
      @keyframes floatCosmic {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes rotatePlanet {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .star { transform-origin: center; animation: twinkle 3s infinite ease-in-out; }
      .star-fast { animation-duration: 2s; }
      .star-slow { animation-duration: 4.5s; }
      .star-d1 { animation-delay: 0.4s; }
      .star-d2 { animation-delay: 1.1s; }
      .star-d3 { animation-delay: 1.8s; }
      .star-d4 { animation-delay: 2.5s; }
      .meteor1 { animation: meteorShoot1 6s infinite linear; }
      .meteor2 { animation: meteorShoot2 7.5s infinite linear; }
      .title-container { animation: floatCosmic 4.5s infinite ease-in-out; transform-origin: center; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="854" height="240" rx="18" fill="url(#cosmicBg)" />

  <!-- Multi-layered Nebulae (Milky Way clouds) -->
  <rect width="854" height="240" rx="18" fill="url(#nebulaCyan)" />
  <rect width="854" height="240" rx="18" fill="url(#nebulaPurple)" />
  <rect width="854" height="240" rx="18" fill="url(#nebulaPink)" />
  <rect width="854" height="240" rx="18" fill="url(#nebulaGold)" />

  <!-- Constellation Lines (Cassiopeia / Orion hints) -->
  <g stroke="#ffffff" stroke-opacity="0.15" stroke-width="0.8" stroke-dasharray="3,3">
    <line x1="80" y1="50" x2="125" y2="35" />
    <line x1="125" y1="35" x2="160" y2="70" />
    <line x1="160" y1="70" x2="200" y2="55" />
    <line x1="200" y1="55" x2="235" y2="90" />

    <line x1="680" y1="45" x2="720" y2="85" />
    <line x1="720" y1="85" x2="775" y2="60" />
    <line x1="775" y1="60" x2="810" y2="105" />
  </g>

  <!-- Glowing Crescent Moon (Upper Left) -->
  <g transform="translate(68, 48)">
    <circle cx="0" cy="0" r="18" fill="url(#moonGlow)" opacity="0.4" />
    <!-- Moon Body -->
    <path d="M-6,-12 A 13 13 0 0 0 10,10 A 11 11 0 1 1 -6,-12 Z" fill="#fef08a" opacity="0.95" />
  </g>

  <!-- Saturn Planet with Orbit Rings (Upper Right) -->
  <g transform="translate(775, 55)">
    <!-- Back of Ring -->
    <path d="M -35,5 A 38 12 0 0 1 35,-5" stroke="url(#saturnRings)" stroke-width="4.5" fill="none" opacity="0.6" transform="rotate(-20)" />
    <!-- Saturn Body -->
    <circle cx="0" cy="0" r="14" fill="url(#saturnBody)" />
    <!-- Front of Ring -->
    <path d="M 35,-5 A 38 12 0 0 1 -35,5" stroke="url(#saturnRings)" stroke-width="4.5" fill="none" opacity="0.95" transform="rotate(-20)" />
    <!-- Little Orbiting Moon -->
    <circle cx="-32" cy="-14" r="2.2" fill="#fed7aa" opacity="0.85" />
  </g>

  <!-- Animated Shooting Stars -->
  <g class="meteor1">
    <line x1="520" y1="20" x2="440" y2="75" stroke="url(#meteorTail1)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="440" cy="75" r="2.5" fill="#ffffff" />
  </g>
  <g class="meteor2">
    <line x1="340" y1="15" x2="270" y2="65" stroke="url(#meteorTail2)" stroke-width="2" stroke-linecap="round" />
    <circle cx="270" cy="65" r="2" fill="#ffffff" />
  </g>

  <!-- Twinkling Milky Way Stars Field -->
  <g fill="#ffffff">
    <!-- Star Points -->
    <circle cx="45" cy="115" r="1.2" class="star star-d1" />
    <circle cx="110" cy="145" r="1.5" class="star star-slow star-d3" />
    <circle cx="145" cy="95" r="1.0" class="star star-d2" />
    <circle cx="190" cy="40" r="1.8" class="star star-fast star-d1" />
    <circle cx="230" cy="130" r="1.3" class="star star-d4" />
    <circle cx="280" cy="65" r="1.6" class="star star-slow star-d2" />
    <circle cx="340" cy="140" r="1.4" class="star star-d3" />
    <circle cx="400" cy="45" r="2.0" class="star star-fast star-d1" />
    <circle cx="475" cy="55" r="1.2" class="star star-d4" />
    <circle cx="530" cy="35" r="1.8" class="star star-slow star-d2" />
    <circle cx="590" cy="145" r="1.5" class="star star-d1" />
    <circle cx="640" cy="70" r="1.9" class="star star-fast star-d3" />
    <circle cx="705" cy="135" r="1.3" class="star star-d4" />
    <circle cx="740" cy="100" r="1.6" class="star star-slow star-d2" />
    <circle cx="820" cy="140" r="1.4" class="star star-d1" />
    <circle cx="830" cy="60" r="1.8" class="star star-fast star-d3" />

    <!-- 4-Point Sparkling Diamond Stars -->
    <path d="M125,35 Q125,43 133,43 Q125,43 125,51 Q125,43 117,43 Q125,43 125,35 Z" fill="#38bdf8" opacity="0.9" class="star star-fast star-d2" />
    <path d="M260,35 Q260,42 267,42 Q260,42 260,49 Q260,42 253,42 Q260,42 260,35 Z" fill="#c084fc" opacity="0.85" class="star star-d3" />
    <path d="M600,45 Q600,53 608,53 Q600,53 600,61 Q600,53 592,53 Q600,53 600,45 Z" fill="#f472b6" opacity="0.95" class="star star-fast star-d1" />
    <path d="M720,85 Q720,91 726,91 Q720,91 720,97 Q720,91 714,91 Q720,91 720,85 Z" fill="#fde047" opacity="0.8" class="star star-slow star-d4" />
  </g>

  <!-- Ambient Wave Ribbons at bottom (Stardust Flow) -->
  <path d="M0,205 C150,185 300,225 460,200 C620,175 750,215 854,195 L854,240 L0,240 Z" fill="url(#stardustWave)" />
  <path d="M0,218 C180,200 340,228 510,210 C680,192 780,222 854,212 L854,240 L0,240 Z" fill="#0d1117" opacity="0.75" />

  <!-- Central Title & Subtitle Card Group -->
  <g class="title-container" text-anchor="middle">
    <!-- Cosmic Starlight Pill Badge -->
    <rect x="332" y="38" width="190" height="26" rx="13" fill="#1e1b4b" fill-opacity="0.7" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="427" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#c7d2fe">
      ✦ MILKY WAY &amp; LOFI ✦
    </text>

    <!-- Main Name Title -->
    <text x="427" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="5" fill="url(#textNeon)">
      TUẤN HÒA
    </text>

    <!-- Aesthetic Subtitle -->
    <text x="427" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="2" fill="#e2e8f0" opacity="0.95">
      🌌 Ngân Hà Vô Tận  •  Giai Điệu Lofi  •  Những Giấc Mơ Số 🎧
    </text>

    <!-- Aesthetic Tagline -->
    <text x="427" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="1.5" fill="#94a3b8">
      ✦ Creative Soul  •  Stargazer &amp; Dreamer  •  Keep Exploring ✨ ✦
    </text>
  </g>
</svg>
