<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="35%" stop-color="#1e1035" />
      <stop offset="70%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Nebula Orbs -->
    <radialGradient id="nebulaCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaPink" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Star Twinkle Animation Styles -->
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .star { transform-origin: center; animation: twinkle 3s infinite ease-in-out; }
      .star-delay-1 { animation-delay: 0.5s; }
      .star-delay-2 { animation-delay: 1.2s; }
      .star-delay-3 { animation-delay: 2s; }
      .star-delay-4 { animation-delay: 2.7s; }
      .title-group { animation: floatSlow 4s infinite ease-in-out; transform-origin: center; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="854" height="220" rx="16" fill="url(#bgGrad)" />

  <!-- Nebula Clouds -->
  <rect width="854" height="220" rx="16" fill="url(#nebulaCyan)" />
  <rect width="854" height="220" rx="16" fill="url(#nebulaPink)" />

  <!-- Twinkling Stars -->
  <g fill="#ffffff">
    <!-- Tiny Stars -->
    <circle cx="80" cy="45" r="1.5" class="star" />
    <circle cx="150" cy="80" r="1" class="star star-delay-1" />
    <circle cx="210" cy="35" r="2" class="star star-delay-3" />
    <circle cx="320" cy="70" r="1.2" class="star star-delay-2" />
    <circle cx="450" cy="30" r="1.8" class="star star-delay-4" />
    <circle cx="560" cy="65" r="1.5" class="star star-delay-1" />
    <circle cx="680" cy="40" r="2" class="star star-delay-2" />
    <circle cx="760" cy="85" r="1.2" class="star star-delay-3" />
    <circle cx="800" cy="35" r="1.6" class="star star-delay-4" />

    <circle cx="100" cy="150" r="1.5" class="star star-delay-2" />
    <circle cx="240" cy="160" r="1.2" class="star star-delay-4" />
    <circle cx="380" cy="140" r="1.6" class="star star-delay-1" />
    <circle cx="620" cy="155" r="1.4" class="star star-delay-3" />
    <circle cx="730" cy="145" r="2" class="star star-delay-1" />

    <!-- 4-Point Sparkle Stars -->
    <path d="M120,40 Q120,50 130,50 Q120,50 120,60 Q120,50 110,50 Q120,50 120,40 Z" fill="#38bdf8" opacity="0.9" class="star star-delay-2" />
    <path d="M720,45 Q720,55 730,55 Q720,55 720,65 Q720,55 710,55 Q720,55 720,45 Z" fill="#f472b6" opacity="0.9" class="star star-delay-4" />
    <path d="M600,130 Q600,137 607,137 Q600,137 600,144 Q600,137 593,137 Q600,137 600,130 Z" fill="#c084fc" opacity="0.8" class="star star-delay-1" />
  </g>

  <!-- Flowing Bottom Waves -->
  <path d="M0,185 C200,205 350,170 520,195 C680,215 780,185 854,195 L854,220 L0,220 Z" fill="url(#waveGrad)" />
  <path d="M0,195 C180,210 320,185 490,205 C650,220 750,195 854,208 L854,220 L0,220 Z" fill="#38bdf8" opacity="0.15" />

  <!-- Animated Center Title & Subtitle Group -->
  <g class="title-group" text-anchor="middle">
    <!-- Main Title -->
    <text x="427" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="4" fill="url(#titleGrad)">
      ✦ TUẤN HÒA ✦
    </text>

    <!-- Subtitle -->
    <text x="427" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="1.5" fill="#e2e8f0" opacity="0.9">
      Exploring the Digital Universe  •  Dreamer &amp; Creator 🌌
    </text>
  </g>
</svg>
